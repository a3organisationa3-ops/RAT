<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Web Access</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Dark Web Access</h1>
    <p>Enter your access key to continue:</p>
    <input type="text" id="access-key" placeholder="Enter Key">
    <br>
    <button onclick="verifyKey()">Unlock</button>
    <button onclick="buyKey()">Buy Key</button>
    <p id="error-message" class="error"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
