<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Hacker's RAT</title>

  <!-- CSS Link -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- JS Link -->
  <script src="./js/share.js" defer></script>
</head>
<body>
  <div class="container">
    <h1 class="neon-text">UNIVERSAL HACKER'S RAT</h1>
    <p class="sub-text">Share with 5 friends to unlock full access!</p>

    <!-- WhatsApp Share Button -->
    <button id="shareBtn" class="btn-whatsapp">Share on WhatsApp</button>

    <!-- Status Box -->
    <div id="shareStatus" class="box">
      <p>Shares: <span id="shareCount">0</span> / 5</p>
    </div>

    <!-- Continue Button -->
    <button id="continueBtn" class="btn-locked" disabled>Continue</button>
  </div>
</body>
</html>
