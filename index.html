<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Web RAT Access</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/share.js" defer></script>
</head>
<body>
  <div class="container">
    <h1 class="neon-text">Final Step...</h1>
    <p class="sub-text">
      Share this RAT link with <span class="highlight">5 friends</span> to unlock the terminal.
    </p>
    
    <button id="shareBtn" class="btn-whatsapp">📲 Share on WhatsApp</button>
    
    <p id="share-count" class="count-text">Shares completed: 0 / 5</p>
    
    <button id="continueBtn" class="btn-continue" disabled>Continue</button>
  </div>
</body>
</html>
