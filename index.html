<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Web Key Access</title>
  <style>
    /* ===== DARK WEB HACKER THEME ===== */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Share Tech Mono', monospace;
    }

    body {
      background: #000;
      color: #ff0000;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: rgba(15, 15, 15, 0.95);
      padding: 30px;
      border: 2px solid #ff0000;
      border-radius: 12px;
      box-shadow: 0 0 25px #ff0000;
    }

    h1 {
      font-size: 28px;
      color: #ff0000;
      text-shadow: 0 0 12px #ff0000, 0 0 25px #ff0000;
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 15px 0;
      border: 2px solid #ff0000;
      background: #111;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
      border-radius: 5px;
    }

    button {
      padding: 12px 30px;
      margin: 10px;
      background: #111;
      color: #ff0000;
      border: 2px solid #ff0000;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    button:hover {
      background: #ff0000;
      color: #000;
      box-shadow: 0 0 15px #ff0000;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff0000;
      font-size: 16px;
      margin-top: 10px;
    }

    .success {
      color: #00ff00;
      font-size: 16px;
      margin-top: 10px;
    }

    .link-section {
      margin-top: 25px;
    }

    .link-section a {
      color: #00ff00;
      text-decoration: none;
      font-size: 18px;
      display: block;
      margin-top: 12px;
    }

    /* Glitch Animation */
    .glitch {
      font-size: 20px;
      position: relative;
      text-shadow: 0 0 5px #ff0000;
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      25% { text-shadow: -2px 0 red, 2px 0 blue; }
      50% { text-shadow: 2px 0 red, -2px 0 blue; }
      75% { text-shadow: -2px 0 red, 2px 0 blue; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dark Web Access</h1>

    <!-- Key Section -->
    <div id="key-section">
      <p>Enter Access Key:</p>
      <input type="text" id="access-key" placeholder="Enter Key">
      <br>
      <button onclick="verifyKey()">Unlock</button>
      <button onclick="buyKey()">Buy Key</button>
      <p id="error-message" class="error"></p>
    </div>

    <!-- Hidden Content After Unlock -->
    <div id="content-section" class="hidden">
      <h1>RAT TOOL PANEL</h1>
      <p class="glitch">Access Granted — Welcome to the Underground.</p>
      
      <div class="link-section">
        <button onclick="shareOnWhatsApp()">Share & Unlock</button>
        <a href="https://your-link-here.com" target="_blank">Go to Tool</a>
      </div>
    </div>
  </div>

  <script>
    const correctKey = "DARKWEB123"; // Change this to your key

    // ===== Verify Key Function =====
    function verifyKey() {
      const key = document.getElementById("access-key").value.trim();
      const errorMsg = document.getElementById("error-message");
      const keySection = document.getElementById("key-section");
      const contentSection = document.getElementById("content-section");

      if (key === correctKey) {
        errorMsg.textContent = "";
        keySection.classList.add("hidden");
        contentSection.classList.remove("hidden");
      } else {
        errorMsg.textContent = "❌ Invalid Key! Try Again.";
      }
    }

    // ===== Buy Key Function =====
    function buyKey() {
      const phoneNumber = "919836942455"; // Your WhatsApp number
      const message = encodeURIComponent("Hello, I want to buy a key for Dark Web RAT Tool.");
      window.open(`https://wa.me/${phoneNumber}?text=${message}`, "_blank");
    }

    // ===== Share On WhatsApp =====
    function shareOnWhatsApp() {
      const shareText = encodeURIComponent("🔥 Dark Web RAT TOOL 🔥\nGet this tool here: https://your-link-here.com");
      
      // Direct WhatsApp share with message
      window.open(`whatsapp://send?text=${shareText}`, "_blank");

      // Fallback for browser
      setTimeout(() => {
        window.open(`https://wa.me/?text=${shareText}`, "_blank");
      }, 800);
    }
  </script>
</body>
</html>
