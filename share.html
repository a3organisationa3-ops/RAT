<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share to Unlock</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="container">
    <h2 class="glitch">Almost There...</h2>
    <p>To activate this RAT, share your unique link with <strong>5 friends</strong> on WhatsApp.</p>
    
    <div class="share-box">
      <p>Link to share:</p>
      <input type="text" id="shareLink" readonly value="https://a3organisationa3-ops.github.io/RAT/">
      <button onclick="copyLink()">Copy Link</button>
      <button onclick="openWhatsApp()">Share on WhatsApp</button>
    </div>

    <p id="shareStatus">Shares completed: <span id="shareCount">0</span> / 5</p>
    <button id="continueBtn" onclick="goToTerminal()" disabled>Continue</button>
  </div>
</body>
</html>
