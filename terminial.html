<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark RAT Terminal</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div class="terminal">
    <pre id="terminalOutput">
Initializing Dark RAT...
Type "help" to see available commands.
----------------------------------------
    </pre>
    <input type="text" id="terminalInput" placeholder="Enter command..." onkeypress="runCommand(event)">
  </div>
</body>
</html>
