<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Access Terminal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
    }

    #terminal {
      background: #111;
      border: 2px solid #00ff00;
      padding: 15px;
      height: 70vh;
      overflow-y: auto;
      font-size: 16px;
      line-height: 1.5;
    }

    #inputArea {
      display: flex;
      margin-top: 20px;
    }

    #commandInput {
      flex: 1;
      padding: 10px;
      background: #000;
      border: 2px solid #00ff00;
      color: #00ff00;
      font-family: inherit;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background: #00ff00;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #crashScreen {
      display: none;
      background: red;
      color: white;
      padding: 50px;
      text-align: center;
      font-size: 22px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h2>💀 Remote Access Trojan Control Panel 💀</h2>
  <div id="terminal">
    <p>Initializing RAT Connection...</p>
  </div>

  <div id="inputArea">
    <input type="text" id="commandInput" placeholder="Enter command..." autofocus>
    <button onclick="runCommand()">Run</button>
  </div>

  <div id="crashScreen">
    <h2>⚠ SERVER CRASHED ⚠</h2>
    <p>Please try again later.</p>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const commands = {
      "RAT - D": [
        "Device Connected...",
        "Device Model: Samsung Galaxy S22",
        "Android Version: 14.0",
        "IP Address: 192.168.1.24",
        "Status: Root Access Gained ✅"
      ],
      "TT": [
        "Accessing Files...",
        "DCIM/Camera/IMG_2025.jpg",
        "WhatsApp/Media/msgstore.db",
        "Downloads/passwords.txt",
        "Access Completed ✅"
      ],
      "NETSCAN": [
        "Scanning Network...",
        "192.168.1.2 - ACTIVE",
        "192.168.1.8 - ACTIVE",
        "192.168.1.12 - INACTIVE",
        "Scan Completed ✅"
      ]
    };

    // Slow typing effect
    function typeLine(text, delay = 50) {
      return new Promise(resolve => {
        let i = 0;
        let interval = setInterval(() => {
          terminal.innerHTML += text.charAt(i);
          i++;
          if (i === text.length) {
            clearInterval(interval);
            terminal.innerHTML += "<br>";
            terminal.scrollTop = terminal.scrollHeight;
            resolve();
          }
        }, delay);
      });
    }

    // Simulate initial loading
    async function initTerminal() {
      await typeLine("Connecting to target device...");
      await typeLine("Establishing secure channel...");
      await typeLine("Remote Access Established ✅");
      await typeLine("Type 'RAT - D', 'TT', or 'NETSCAN' to continue...");
    }

    initTerminal();

    function runCommand() {
      const input = document.getElementById('commandInput').value.trim();
      document.getElementById('commandInput').value = "";

      if (commands[input]) {
        commands[input].forEach(async (line, i) => {
          await new Promise(resolve => setTimeout(resolve, i * 700));
          terminal.innerHTML += line + "<br>";
          terminal.scrollTop = terminal.scrollHeight;
        });
      } else {
        terminal.innerHTML += `<span style='color:red;'>Unknown command: ${input}</span><br>`;
      }

      // Crash after 2 minutes
      setTimeout(() => {
        document.getElementById('terminal').style.display = 'none';
        document.getElementById('inputArea').style.display = 'none';
        document.getElementById('crashScreen').style.display = 'block';
      }, 120000); // 2 minutes
    }
  </script>

</body>
</html>
