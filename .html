<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Key Access</title>
  <style>
    /* Dark Web Theme */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Share Tech Mono', monospace;
    }

    body {
      background-color: #000;
      color: #ff0000;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: rgba(20, 20, 20, 0.9);
      padding: 30px;
      border: 2px solid #ff0000;
      border-radius: 10px;
      box-shadow: 0 0 25px #ff0000;
    }

    h1 {
      font-size: 28px;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 15px 0;
      border: 2px solid #ff0000;
      background: #111;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    button {
      padding: 10px 25px;
      margin: 10px;
      background: #111;
      color: #ff0000;
      border: 2px solid #ff0000;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      border-radius: 5px;
      text-transform: uppercase;
    }

    button:hover {
      background: #ff0000;
      color: #000;
      box-shadow: 0 0 15px #ff0000;
    }

    .hidden {
      display: none;
    }

    .glitch {
      font-size: 18px;
      color: #ff0000;
      text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000;
      margin-top: 15px;
    }

    .link-section {
      margin-top: 20px;
    }

    .link-section a {
      color: #00ff00;
      text-decoration: none;
      font-size: 18px;
      display: block;
      margin-top: 10px;
    }

    .error {
      color: #ff0000;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dark Key Access</h1>

    <!-- Key Access Section -->
    <div id="key-section">
      <p>Enter Your Key:</p>
      <input type="text" id="access-key" placeholder="Enter Key">
      <br>
      <button onclick="verifyKey()">Unlock</button>
      <button onclick="buyKey()">Buy Key</button>
      <p id="error-message" class="error"></p>
    </div>

    <!-- Hidden Content After Unlock -->
    <div id="content-section" class="hidden">
      <h1>Welcome to RAT</h1>
      <p class="glitch">Your access has been granted.</p>
      <div class="link-section">
        <button onclick="shareOnWhatsApp()">Share & Unlock</button>
        <a href="https://your-link-here.com" target="_blank">Go to Tool</a>
      </div>
    </div>
  </div>

  <script>
    const correctKey = "DARKWEB123"; // Change this to your real access key

    function verifyKey() {
      const key = document.getElementById("access-key").value.trim();
      const errorMessage = document.getElementById("error-message");
      const keySection = document.getElementById("key-section");
      const contentSection = document.getElementById("content-section");

      if (key === correctKey) {
        keySection.classList.add("hidden");
        contentSection.classList.remove("hidden");
      } else {
        errorMessage.textContent = "❌ Invalid Key! Try Again.";
      }
    }

    function buyKey() {
      // WhatsApp Buy Key
      const phoneNumber = "919836942455";
      const message = encodeURIComponent("Hello, I want to buy a key for access.");
      window.location.href = `https://wa.me/${phoneNumber}?text=${message}`;
    }

    function shareOnWhatsApp() {
      // Share & Unlock Logic
      const shareMessage = encodeURIComponent("🔥 RAT TOOL 🔥\nGet this powerful tool here: https://your-link-here.com");
      window.location.href = `https://wa.me/?text=${shareMessage}`;
    }
  </script>
</body>
  </html>
